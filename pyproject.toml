[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartm2m-swe-agent"
version = "0.1.0"
description = "A reproducible Track 3 SWE-agent comparison harness"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ghiffari Ahmadijaya"}]
dependencies = []

[project.optional-dependencies]
# Keep the local/CI quality gate versions reproducible alongside the benchmark
# dependency pins in requirements-evaluation.txt.
dev = ["pytest==9.1.1", "ruff==0.16.7"]

[project.scripts]
smartm2m = "smartm2m.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP022", "UP035", "UP037"]
