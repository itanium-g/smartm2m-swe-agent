# External coding-agent benchmark configuration for Codex CLI vs Antigravity CLI
protocol_version: external-agents-v1

manifest:
  path: ../tasks/evaluation.json
  expected_count: 8
  selection_file: ../tasks/evaluation.selection.json
  selection_ids_sha256: 395f2adfaf4b9b2c5a129b7de83fe886d4f3b281fb9588d5802e2dfcaa717dfb

execution:
  attempts_per_task: 1
  wall_time_seconds: 2700
  sequential: true
  command_timeout_seconds: 120

codex:
  executable: codex
  model: gpt-6.1-sol
  ephemeral: true
  structured_output: true
  # Sandbox mode: danger-full-access allows the agent to execute ./.benchmark/test inside Docker
  sandbox: danger-full-access
  ignore_user_config: true
  ignore_rules: true

agy:
  executable: agy
  model: gemini-3.8-flash-high
  effort: high
  output_format: stream-json
  dangerously_skip_permissions: true
  disable_slash_commands: true

evaluator:
  reuse_pinned_swebench: true
  dataset_name: MariusHobbhahn/swe-bench-verified-mini
  dataset_revision: b316c349947c29963fce3f4a65967c9807a4b673
  evaluator_metadata_dataset: SWE-bench/SWE-bench_Verified
  evaluator_metadata_revision: 78f471bf655a3137b2e8a75af1501690ec009ec3
  split: test

results_root: ../results
