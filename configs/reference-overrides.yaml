# Loaded after mini-swe-agent's pinned built-in swebench.yaml.
# This is configuration-only; the upstream agent, prompt, parser, and
# environment implementation remain untouched.
agent:
  step_limit: 60
  # Dollar pricing is provider-specific; the common primary cap is step_limit=60.
  # Keep the upstream agent's own cost guard far above the primary run so it
  # cannot silently impose a different budget when pricing is unavailable.
  cost_limit: 1000000
environment:
  timeout: 120
model:
  model_kwargs:
    api_base: https://api.groq.com/openai/v1
    temperature: 0
    seed: 42
    max_tokens: 8192
    timeout: 120
  cost_tracking: ignore_errors
